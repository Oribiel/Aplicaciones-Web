<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="parrafoejemplo">Hola Mundo</p>
    <script>
        let parrafo = document.getElementById("parrafoejemplo")
        console.log(parrafo)

        let parrafo2 = document.createElement("h1")
        var contenido = document.createTextNode("Hola mundo desde mi primer parrafo creado con document")
        parrafo2.appendChild(contenido);

        setTimeout(()=>{
            document.body.appendChild(parrafo2)
        }, 2000)
        setTimeout(()=>{
            parrafo.parentNode.removeChild(parrafo)
        }, 4000)

    </script>
</body>
</html>
